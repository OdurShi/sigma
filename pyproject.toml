[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sigma-guidance"
version = "0.1.0"
description = "SIGMA: label-efficient training of language models to follow changing structured guidance (official implementation)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "The SIGMA authors" }]
keywords = ["language models", "LoRA", "few-shot intent classification", "equivariance", "structured guidance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "torch>=2.4",
    "transformers>=5.20",
    "peft>=0.21",
]

[project.optional-dependencies]
data = ["sentence-transformers>=2.6"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
sigma = "sigma.cli:main"

[project.urls]
Repository = "https://github.com/OdurShi/sigma"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E741"]
